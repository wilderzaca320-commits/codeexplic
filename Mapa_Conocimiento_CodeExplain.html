<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Conocimiento - CodeExplain (Fase 5)</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#060a12;color:#e2e8f0;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;
  }

  header{
    display:flex;align-items:center;gap:18px;
    padding:12px 20px;border-bottom:1px solid #1b2740;
    background:linear-gradient(180deg,#0b1220,#080d18);
    flex:0 0 auto;
  }
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:15px;letter-spacing:.2px;color:#f1f5f9}
  .brand span{font-size:11px;color:#64748b;letter-spacing:.6px;text-transform:uppercase}
  .stats{display:flex;gap:14px;font-size:11.5px;color:#94a3b8;margin-left:6px}
  .stats i{color:#475569;font-style:normal}
  .stats b{color:#e2e8f0;font-weight:600}

  .search{position:relative;margin-left:auto}
  .search input{
    width:250px;background:#0b1220;border:1px solid #1e2b45;border-radius:9px;
    color:#e2e8f0;font-size:12.5px;padding:8px 30px 8px 32px;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .search svg{position:absolute;left:10px;top:9px;width:14px;height:14px;stroke:#64748b}
  .search kbd{
    position:absolute;right:8px;top:7px;font-size:10px;color:#64748b;
    border:1px solid #1e2b45;border-radius:4px;padding:1px 5px;font-family:inherit;
  }

  .actions{display:flex;gap:7px}
  button.tool{
    background:#0e1728;border:1px solid #1e2b45;color:#cbd5e1;
    font-size:11.5px;padding:7px 11px;border-radius:8px;cursor:pointer;
    transition:.16s;font-family:inherit;white-space:nowrap;
  }
  button.tool:hover{background:#152238;border-color:#2f4265;color:#fff}
  button.tool:active{transform:translateY(1px)}

  main{flex:1;display:flex;min-height:0;position:relative}

  #stage{
    flex:1;position:relative;min-width:0;overflow:hidden;cursor:grab;
    background:
      radial-gradient(1200px 600px at 20% 0%, rgba(52,211,153,.055), transparent 60%),
      radial-gradient(1000px 600px at 85% 100%, rgba(96,165,250,.06), transparent 60%),
      #060a12;
  }
  #stage.grabbing{cursor:grabbing}
  #stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(148,163,184,.14) 1px, transparent 1px);
    background-size:26px 26px;
    mask-image:radial-gradient(circle at 50% 45%, #000 55%, transparent 100%);
  }
  svg#graph{position:relative;width:100%;height:100%;display:block;user-select:none}

  .node{cursor:pointer}
  .node rect{
    fill:#0b1322;stroke:var(--c,#94a3b8);stroke-width:1.2;
    transition:fill .18s, stroke-width .18s, filter .18s;
  }
  .node:hover rect{fill:#111d33;stroke-width:1.9}
  .node.selected rect{fill:#132441;stroke-width:2.4;filter:drop-shadow(0 0 9px var(--c))}
  .node.match rect{stroke:#fbbf24;stroke-width:2.2;filter:drop-shadow(0 0 8px rgba(251,191,36,.7))}
  .node text{fill:#cbd5e1;pointer-events:none}
  .node.k-domain text{fill:#f1f5f9;font-weight:600}
  .node.k-dim text{fill:#e2e8f0;font-weight:600}
  .node.k-leaf text{fill:#a9b7cc}
  .node.faded{opacity:.16}
  .node.hidden{display:none}

  .edge{fill:none;stroke:rgba(148,163,184,.30);stroke-width:1.15}
  .edge.faded{opacity:.10}
  .xedge{fill:none;stroke-width:1.25}
  .xedge.hard{stroke:rgba(125,211,252,.55);stroke-dasharray:none}
  .xedge.soft{stroke:rgba(167,139,250,.60);stroke-dasharray:5 5}
  .xedge.faded{opacity:.07}
  .xlabel{font-size:9.5px;fill:#7dd3fc;letter-spacing:.3px;paint-order:stroke;stroke:#060a12;stroke-width:3px;pointer-events:none}
  .xlabel.soft{fill:#c4b5fd}

  #legend{
    position:absolute;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px 14px;
    max-width:calc(100% - 200px);padding:10px 13px;border-radius:11px;
    background:rgba(9,15,27,.82);border:1px solid #1b2740;backdrop-filter:blur(8px);
    font-size:11px;color:#94a3b8;
  }
  #legend .it{display:flex;align-items:center;gap:6px}
  #legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  #legend .ln{width:18px;height:0;border-top:2px solid;display:inline-block}

  #hint{
    position:absolute;right:16px;bottom:14px;font-size:10.5px;color:#5b6b85;
    background:rgba(9,15,27,.75);border:1px solid #1b2740;padding:7px 11px;border-radius:9px;
  }

  #panel{
    position:absolute;right:0;top:0;bottom:0;z-index:5;
    width:0;overflow:hidden;background:#080e19;
    border-left:1px solid #16213a;transition:width .28s cubic-bezier(.4,0,.2,1);
    box-shadow:-24px 0 60px rgba(0,0,0,.55);
  }
  #panel.open{width:382px}
  .panel-in{width:382px;height:100%;overflow-y:auto;padding:18px 18px 26px}
  .panel-in::-webkit-scrollbar{width:9px}
  .panel-in::-webkit-scrollbar-thumb{background:#1e2b45;border-radius:9px}

  .p-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .p-code{
    font-family:ui-monospace,Consolas,monospace;font-size:10.5px;letter-spacing:.4px;
    color:#7dd3fc;background:rgba(125,211,252,.09);border:1px solid rgba(125,211,252,.22);
    padding:3px 7px;border-radius:5px;
  }
  .p-kind{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-top:5px}
  .p-close{
    margin-left:auto;background:none;border:1px solid #1e2b45;color:#94a3b8;cursor:pointer;
    width:26px;height:26px;border-radius:7px;font-size:15px;line-height:1;font-family:inherit;
  }
  .p-close:hover{background:#152238;color:#fff}
  .p-title{font-size:17px;font-weight:650;color:#f1f5f9;margin:0 0 8px;line-height:1.3}
  .p-crumb{font-size:10.5px;color:#5b6b85;margin-bottom:14px;line-height:1.6}
  .p-crumb b{color:#94a3b8;font-weight:500}
  .p-desc{font-size:12.8px;line-height:1.65;color:#b6c4d8;margin:0 0 16px}

  .p-sec{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#5b6b85;margin:18px 0 8px;font-weight:600}
  .p-meta{
    font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.7;color:#8fb3d9;
    background:#0a111e;border:1px solid #16213a;border-radius:8px;padding:10px 12px;
    white-space:pre-wrap;word-break:break-word;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    background:#0c1524;border:1px solid #1c2942;color:#a9b7cc;font-size:11px;
    padding:5px 9px;border-radius:7px;cursor:pointer;font-family:inherit;transition:.15s;
    display:flex;align-items:center;gap:6px;
  }
  .chip:hover{background:#14213a;border-color:#2f4265;color:#fff}
  .chip .sw{width:7px;height:7px;border-radius:2px}

  .p-note{font-size:10.5px;color:#4b5a72;line-height:1.6;margin-top:22px;border-top:1px solid #131d31;padding-top:12px}

  @media (max-width:960px){
    .stats{display:none}
    .search input{width:150px}
    #panel.open{width:100%}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <b>Mapa de Conocimiento</b>
    <span>CodeExplain &middot; Fase 5</span>
  </div>
  <div class="stats">
    <span><b>2</b> dominios</span><i>|</i>
    <span><b>12</b> dimensiones</span><i>|</i>
    <span><b>47</b> tipos de artefacto</span><i>|</i>
    <span><b>12</b> relaciones cruzadas</span>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Buscar artefacto o codigo..." autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </div>

  <div class="actions">
    <button class="tool" id="expand">Expandir todo</button>
    <button class="tool" id="collapse">Contraer</button>
    <button class="tool" id="center">Centrar</button>
    <button class="tool" id="json">JSON</button>
  </div>
</header>

<main>
  <div id="stage">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg">
      <g id="viewport">
        <g id="gEdges" pointer-events="none"></g>
        <g id="gCross" pointer-events="none"></g>
        <g id="gNodes"></g>
      </g>
    </svg>

    <div id="legend">
      <span class="it"><span class="dot" style="background:#34d399"></span>K1 proyecto</span>
      <span class="it"><span class="dot" style="background:#60a5fa"></span>K2 producto</span>
      <span class="it"><span class="dot" style="background:#fbbf24"></span>unidad / hallazgo</span>
      <span class="it"><span class="dot" style="background:#a78bfa"></span>documento</span>
      <span class="it"><span class="ln" style="border-color:rgba(125,211,252,.75)"></span>relacion verificada</span>
      <span class="it"><span class="ln" style="border-color:rgba(167,139,250,.85);border-top-style:dashed"></span>inferida por IA</span>
    </div>

    <div id="hint">Rueda = zoom &middot; Arrastrar = mover &middot; Clic = ficha &middot; Clic en una dimension = desplegar</div>
  </div>

  <aside id="panel">
    <div class="panel-in" id="panelIn"></div>
  </aside>
</main>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 * 1. DATOS DEL GRAFO  (fuente: Documento Fase 5, secciones 2, 5 y 9)
 * ------------------------------------------------------------------ */

var NODES = [];
var byId = {};
function N(o){ NODES.push(o); byId[o.id] = o; return o; }

/* Raiz */
N({id:"ce", parent:null, kind:"root", code:"CE", label:"Conocimiento CodeExplain",
   desc:"Grafo completo del conocimiento del producto: dos dominios, doce dimensiones y cuarenta y siete tipos de artefacto. Toda unidad se guarda atomica (L1) y se compone bajo demanda (L4).",
   meta:"version: 1.0\nfecha: 2026-11-11\nnodos: 62\naristas: 12 cruzadas\nprofundidad: 4 niveles"});

/* Dominios */
N({id:"k1", parent:"ce", kind:"domain", code:"K1", label:"K1 - Proyecto analizado",
   desc:"Conocimiento que CodeExplain genera al analizar el software del usuario. Vive por proyecto, esta respaldado por evidencia y es efimero salvo que se persista (v1.1).",
   meta:"dominio: K1\nproyecto_id: obligatorio\nretencion: sesion | 30d | 90d\nfuente_id: obligatoria"});

N({id:"k2", parent:"ce", kind:"domain", code:"K2", label:"K2 - Producto CodeExplain",
   desc:"Conocimiento sobre CodeExplain mismo: las cinco fases, los 85 requerimientos, las decisiones de arquitectura, los manuales y la operacion. Es permanente y versionado.",
   meta:"dominio: K2\nproyecto_id: null\nretencion: permanente\nversionado: semver + checksum"});

/* Dimensiones K1 */
N({id:"k1-ctx", parent:"k1", kind:"dim", code:"K1.PRY.CTX", label:"Contexto",
   desc:"Que es el proyecto: vision general, stack tecnologico, repositorios y puntos de entrada detectados."});
N({id:"k1-arq", parent:"k1", kind:"dim", code:"K1.PRY.ARQ", label:"Arquitectura",
   desc:"Como esta construido: modulos, dependencias entre ellos, metricas de acoplamiento y diagramas."});
N({id:"k1-dat", parent:"k1", kind:"dim", code:"K1.PRY.DAT", label:"Datos",
   desc:"Que datos maneja: tablas, columnas, relaciones y el origen del esquema."});
N({id:"k1-com", parent:"k1", kind:"dim", code:"K1.PRY.COM", label:"Comportamiento",
   desc:"Que hace el sistema: casos de uso, escenarios Gherkin, endpoints y flujos de usuario."});
N({id:"k1-cal", parent:"k1", kind:"dim", code:"K1.PRY.CAL", label:"Calidad",
   desc:"Que tan sano esta: riesgos STRIDE, CVEs, deuda tecnica, puntos unicos de falla y salud del AST."});
N({id:"k1-doc", parent:"k1", kind:"dim", code:"K1.PRY.DOC", label:"Documentacion",
   desc:"Que documentacion se genera desde el conocimiento: README, OpenAPI, C4 y ADR del proyecto."});
N({id:"k1-con", parent:"k1", kind:"dim", code:"K1.PRY.CON", label:"Conversacion",
   desc:"Que se pregunto y que se respondio: sesiones, mensajes, consultas del historial y prompts por nivel."});

/* Dimensiones K2 */
N({id:"k2-vis", parent:"k2", kind:"dim", code:"K2.PRD.VIS", label:"Vision y fases",
   desc:"Las cinco fases del proyecto, desde las fuentes primarias hasta esta arquitectura del conocimiento."});
N({id:"k2-req", parent:"k2", kind:"dim", code:"K2.PRD.REQ", label:"Requisitos",
   desc:"Los 85 requerimientos verificables: 71 funcionales, 7 no funcionales, 4 reglas de negocio y 3 restricciones."});
N({id:"k2-arq", parent:"k2", kind:"dim", code:"K2.PRD.ARQ", label:"Arquitectura tecnica",
   desc:"Decisiones y requerimientos significativos: 13 ADR, 18 ASR y 18 escenarios medibles."});
N({id:"k2-man", parent:"k2", kind:"dim", code:"K2.PRD.MAN", label:"Manuales",
   desc:"Manual de usuario de las 12 vistas, guia de instalacion y contratos de API."});
N({id:"k2-ops", parent:"k2", kind:"dim", code:"K2.PRD.OPS", label:"Operacion",
   desc:"Entorno local, gestion de secretos y politica de privacidad y retencion."});

/* Artefactos K1 */
var L1 = [
 ["k1-ctx-vis","k1-ctx","K1.PRY.CTX.VIS","Vision general","ku","Metricas del proyecto: total de archivos, SLOC, salud del AST, horas de deuda y numero de SPOF.","nombre, tag, lenguajes, created_at, owner"],
 ["k1-ctx-stk","k1-ctx","K1.PRY.CTX.STK","Stack tecnologico","ku","Lenguajes y frameworks detectados por extension de archivo y manifiestos de dependencias.","lenguaje, porcentaje, archivo_manifiesto"],
 ["k1-ctx-rep","k1-ctx","K1.PRY.CTX.REP","Repositorios","ku","Fuente de codigo concreta: URL, rama, SLOC, numero de archivos y ultimo commit.","rama, sloc, files_count, last_commit_hash, synced_at"],
 ["k1-ctx-ent","k1-ctx","K1.PRY.CTX.ENT","Entradas detectadas","ku","Archivos de arranque del sistema: index, main, server o app.","ruta, tipo, linea"],

 ["k1-arq-mod","k1-arq","K1.PRY.ARQ.MOD","Modulos","ku","Unidad de codigo con responsabilidad propia y limites definidos (carpeta de primer nivel).","nombre, ca, ce, instability, files, loc"],
 ["k1-arq-dep","k1-arq","K1.PRY.ARQ.DEP","Dependencias","ku","Arista dirigida entre dos modulos: quien importa a quien y con que peso.","origen, destino, peso, tipo"],
 ["k1-arq-met","k1-arq","K1.PRY.ARQ.MET","Metricas","ku","Acoplamiento Ca/Ce e inestabilidad calculada como I = Ce / (Ca + Ce).","ca, ce, instability, calculado_en"],
 ["k1-arq-dia","k1-arq","K1.PRY.ARQ.DIA","Diagramas C4 / UML","doc","Vista visual de la arquitectura generada a partir de los modulos y sus dependencias.","doc_type=c4, formato=plantuml, version"],

 ["k1-dat-tab","k1-dat","K1.PRY.DAT.TAB","Tablas","ku","Estructura persistente con filas estimadas y estrategia de particion.","nombre, is_core, rows_estimate, partition"],
 ["k1-dat-col","k1-dat","K1.PRY.DAT.COL","Columnas","ku","Atributo de una tabla con tipo de dato, PK, FK y unicidad.","nombre, data_type, is_pk, is_fk, fk_target"],
 ["k1-dat-rel","k1-dat","K1.PRY.DAT.REL","Relaciones","ku","Llaves foraneas y cardinalidad entre tablas.","origen, destino, cardinalidad, on_delete"],
 ["k1-dat-mig","k1-dat","K1.PRY.DAT.MIG","Migraciones","ku","Origen del esquema: migracion versionada, introspeccion o script SQL.","archivo, orden, checksum"],

 ["k1-com-cu","k1-com","K1.PRY.COM.CU","Casos de uso","ku","Interaccion entre un actor y el sistema con precondicion y postcondicion.","code, actor, precondition, postcondition, complexity"],
 ["k1-com-ghe","k1-com","K1.PRY.COM.GHE","Escenarios Gherkin","ku","Secuencia Dado / Cuando / Entonces asociada a un caso de uso.","code, pasos, evidencia"],
 ["k1-com-api","k1-com","K1.PRY.COM.API","Endpoints","ku","Contrato HTTP: metodo, ruta, autenticacion, entrada y salida.","metodo, ruta, auth, request, response"],
 ["k1-com-flu","k1-com","K1.PRY.COM.FLU","Flujos de usuario","ku","Recorrido de pantallas que realiza un actor hasta cumplir su objetivo.","pasos, vistas, condicion_fin"],

 ["k1-cal-rie","k1-cal","K1.PRY.CAL.RIE","Riesgos","ku","Amenaza STRIDE con severidad, impacto, estado y mitigacion propuesta.","categoria, severidad, estado, impacto, mitigacion, evidencia"],
 ["k1-cal-cve","k1-cal","K1.PRY.CAL.CVE","CVEs","ku","Vulnerabilidad publica detectada en una dependencia del proyecto.","cve_id, paquete, version, cvss"],
 ["k1-cal-deu","k1-cal","K1.PRY.CAL.DEU","Deuda tecnica","ku","Costo futuro estimado en horas por una dependencia obsoleta o un atajo de implementacion.","horas, dependencia, version_actual, version_objetivo"],
 ["k1-cal-spo","k1-cal","K1.PRY.CAL.SPO","SPOF","ku","Punto unico de falla: componente sin redundancia cuya caida detiene el sistema.","componente, impacto, evidencia"],
 ["k1-cal-ast","k1-cal","K1.PRY.CAL.AST","Salud del AST","ku","Porcentaje de archivos parseados correctamente durante el analisis.","parsed, failed, ratio"],

 ["k1-doc-rea","k1-doc","K1.PRY.DOC.REA","README","doc","Documento compuesto por unidades de conocimiento del proyecto, sin texto inventado.","doc_type=readme, template_id, checksum, estado"],
 ["k1-doc-oas","k1-doc","K1.PRY.DOC.OAS","OpenAPI","doc","Contrato de API generado a partir de los endpoints detectados.","doc_type=openapi, version, rutas"],
 ["k1-doc-c4","k1-doc","K1.PRY.DOC.C4","Diagrama C4","doc","Salida PlantUML del modelo de modulos y dependencias.","doc_type=c4, formato, generated_at"],
 ["k1-doc-adr","k1-doc","K1.PRY.DOC.ADR","ADR del proyecto","doc","Decision de arquitectura registrada para el proyecto analizado.","id, contexto, decision, consecuencias"],

 ["k1-con-ses","k1-con","K1.PRY.CON.SES","Sesiones de chat","ku","Agrupacion de mensajes que forman una conversacion con el asistente.","session_id, inicio, modelo"],
 ["k1-con-msg","k1-con","K1.PRY.CON.MSG","Mensajes","ku","Turno de conversacion con remitente, nivel, modelo y consumo de tokens.","sender, nivel, modelo, tokens, created_at"],
 ["k1-con-que","k1-con","K1.PRY.CON.QUE","Consultas","ku","Pregunta registrada en el historial con categoria, resumen y marca de favorito.","categoria, pregunta, resumen, tokens, favorito"],
 ["k1-con-pro","k1-con","K1.PRY.CON.PRO","Prompts","ku","Plantilla de instruccion por nivel (basico, intermedio, avanzado) versionada.","prompt_id, nivel, objetivo, version"]
];

/* Artefactos K2 */
var L2 = [
 ["k2-vis-f1","k2-vis","K2.PRD.VIS.F1","Fase 1 - Fuentes primarias","doc","Stakeholders, guion de entrevista, encuesta Likert, focus group y matriz de hallazgos.","fase=1, doc, version"],
 ["k2-vis-f2","k2-vis","K2.PRD.VIS.F2","Fase 2 - Inventario funcional","doc","Quince modulos y 71 requerimientos funcionales mapeados entre frontend y backend.","fase=2, doc, version"],
 ["k2-vis-f3","k2-vis","K2.PRD.VIS.F3","Fase 3 - SRS","doc","Ochenta y cinco requerimientos verificables, DER de trece tablas y casos de uso.","fase=3, doc, version"],
 ["k2-vis-f4","k2-vis","K2.PRD.VIS.F4","Fase 4 - ARD","doc","Dieciocho ASR, catorce drivers, quince restricciones y trece decisiones de arquitectura.","fase=4, doc, version"],
 ["k2-vis-f5","k2-vis","K2.PRD.VIS.F5","Fase 5 - Conocimiento","doc","Este documento: taxonomia, tesauro, metadatos, granularidad, busqueda y mapa.","fase=5, doc, version"],

 ["k2-req-rf","k2-req","K2.PRD.REQ.RF","Requerimientos funcionales","ku","Cuarenta y seis RF de frontend y veinticinco de backend, cada uno con criterios de aceptacion.","id, modulo, actor, prioridad MoSCoW"],
 ["k2-req-rnf","k2-req","K2.PRD.REQ.RNF","Requerimientos no funcionales","ku","Diez RNF medibles: rendimiento, seguridad, usabilidad, mantenibilidad.","id, metrica, umbral, escenario"],
 ["k2-req-rn","k2-req","K2.PRD.REQ.RN","Reglas de negocio","ku","Cuatro reglas que el sistema debe cumplir siempre, independientes de la interfaz.","id, enunciado, origen"],
 ["k2-req-re","k2-req","K2.PRD.REQ.RE","Restricciones","ku","Tres restricciones tecnicas o regulatorias que limitan el diseno.","id, tipo, impacto"],

 ["k2-arq-adr","k2-arq","K2.PRD.ARQ.ADR","Decisiones (ADR)","doc","Trece decisiones registradas: digest-only, sin base de datos en v1, fallback heuristico.","id, contexto, decision, estado, consecuencias"],
 ["k2-arq-asr","k2-arq","K2.PRD.ARQ.ASR","Requerimientos significativos","ku","Dieciocho ASR filtrados de los ochenta y cinco requerimientos por impacto arquitectonico.","id, escenario, driver, prioridad"],
 ["k2-arq-esc","k2-arq","K2.PRD.ARQ.ESC","Escenarios medibles","ku","Dieciocho escenarios de seis partes con estimulo, metrica y umbral verificable.","id, estimulo, metrica, umbral"],

 ["k2-man-usr","k2-man","K2.PRD.MAN.USR","Manual de usuario","doc","Las doce vistas, los atajos de teclado y el flujo de trabajo recomendado.","doc_type=manual, audiencia, version"],
 ["k2-man-ins","k2-man","K2.PRD.MAN.INS","Instalacion","doc","Node 20 o superior, puerto 3100, ruta ASCII y variables de entorno.","doc_type=install, requisitos, pasos"],
 ["k2-man-api","k2-man","K2.PRD.MAN.API","Contratos de API","doc","Tres endpoints implementados mas los pendientes de analisis de ZIP y URL.","doc_type=api, metodo, ruta, esquema"],

 ["k2-ops-ent","k2-ops","K2.PRD.OPS.ENT","Entorno","ku","Un solo equipo Windows, sin servicios externos, alineado con la restriccion C-TEC-01.","so, node, puerto, ruta, variables"],
 ["k2-ops-seg","k2-ops","K2.PRD.OPS.SEG","Seguridad","ku","La clave de Gemini vive en el servidor (.env); nunca se expone en el cliente.","secreto, ubicacion, rotacion"],
 ["k2-ops-pri","k2-ops","K2.PRD.OPS.PRI","Privacidad y retencion","ku","El codigo no se persiste en v1; las consultas duran treinta dias y se pueden borrar.","sensibilidad, retencion, borrado"]
];

function pushLeaves(list){
  for(var i=0;i<list.length;i++){
    var a=list[i];
    N({id:a[0], parent:a[1], kind:"leaf", code:a[2], label:a[3], cat:a[4], desc:a[5], meta:a[6]});
  }
}
pushLeaves(L1); pushLeaves(L2);

/* Aristas cruzadas tipadas */
var CROSS = [
 {from:"k1-cal-rie", to:"k1-doc-adr", rel:"documenta",  soft:false},
 {from:"k1-arq-mod", to:"k1-doc-c4",  rel:"documenta",  soft:false},
 {from:"k1-com-api", to:"k1-doc-oas", rel:"documenta",  soft:false},
 {from:"k1-con-msg", to:"k1-doc-rea", rel:"cita",       soft:true },
 {from:"k1-cal-deu", to:"k1-cal-rie", rel:"deriva_de",  soft:false},
 {from:"k1-ctx-rep", to:"k1-arq-mod", rel:"contiene",   soft:false},
 {from:"k1-cal-rie", to:"k1-com-cu",  rel:"afecta",     soft:true },
 {from:"k1-cal-deu", to:"k1-cal-cve", rel:"deriva_de",  soft:false},
 {from:"k2-arq-adr", to:"k1-arq-mod", rel:"documenta",  soft:true },
 {from:"k2-man-usr", to:"k2-req-rf",  rel:"cita",       soft:false},
 {from:"k2-req-rnf", to:"k2-arq-asr", rel:"afecta",     soft:false},
 {from:"k2-ops-pri", to:"k1-con-que", rel:"afecta",     soft:false}
];

/* ------------------------------------------------------------------ *
 * 2. ESTADO
 * ------------------------------------------------------------------ */

var COLX = [24, 320, 620, 930];
var ROW = 37;
var expanded = {};            /* id de dimension -> true */
var selected = null;
var matched = {};
var view = {x:0, y:0, k:1};
var panelOpen = false;

var stage  = document.getElementById("stage");
var svg    = document.getElementById("graph");
var vp     = document.getElementById("viewport");
var gEdges = document.getElementById("gEdges");
var gCross = document.getElementById("gCross");
var gNodes = document.getElementById("gNodes");
var panel  = document.getElementById("panel");
var panelIn= document.getElementById("panelIn");

var COLORS = {
  root:"#f8fafc",
  k1:"#34d399",
  k2:"#60a5fa",
  ku:"#fbbf24",
  doc:"#a78bfa"
};

function colorOf(n){
  if(n.kind === "root")   return COLORS.root;
  if(n.kind === "domain") return n.id === "k1" ? COLORS.k1 : COLORS.k2;
  if(n.kind === "dim")    return n.parent === "k1" ? COLORS.k1 : COLORS.k2;
  return n.cat === "doc" ? COLORS.doc : COLORS.ku;
}

/* ------------------------------------------------------------------ *
 * 3. CONSTRUCCION DEL DOM
 * ------------------------------------------------------------------ */

function childrenOf(id){
  return NODES.filter(function(n){ return n.parent === id; });
}

function measure(n){
  var fs = n.kind === "leaf" ? 11 : 12.5;
  var cw = n.kind === "leaf" ? 6.45 : 7.35;
  n.w = Math.max(84, Math.min(250, n.label.length * cw + 28));
  n.h = n.kind === "leaf" ? 28 : (n.kind === "dim" ? 32 : 36);
  n.fs = fs;
}

function build(){
  NODES.forEach(function(n){
    measure(n);
    var g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node k-" + n.kind);
    g.style.setProperty("--c", colorOf(n));
    g.dataset.id = n.id;

    var r = document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x", -n.w/2);
    r.setAttribute("y", -n.h/2);
    r.setAttribute("width", n.w);
    r.setAttribute("height", n.h);
    r.setAttribute("rx", n.kind === "leaf" ? 7 : 9);
    g.appendChild(r);

    var t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", -n.w/2 + 13);
    t.setAttribute("y", 0);
    t.setAttribute("dominant-baseline","middle");
    t.setAttribute("font-size", n.fs);
    t.textContent = n.label;
    g.appendChild(t);

    g.addEventListener("click", function(ev){
      ev.stopPropagation();
      onNodeClick(n.id);
    });
    g.addEventListener("pointerenter", function(){ highlight(n.id); });
    g.addEventListener("pointerleave", function(){ if(selected) highlight(selected); else clearHighlight(); });

    gNodes.appendChild(g);
    n.el = g;

    if(n.parent){
      var p = document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("class","edge");
      gEdges.appendChild(p);
      n.pedge = p;
    }
  });

  CROSS.forEach(function(e){
    var p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("class","xedge " + (e.soft ? "soft" : "hard"));
    gCross.appendChild(p);
    e.el = p;

    var t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("class","xlabel" + (e.soft ? " soft" : ""));
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","middle");
    t.textContent = e.rel;
    t.style.display = "none";
    gCross.appendChild(t);
    e.tx = t;
  });
}

/* ------------------------------------------------------------------ *
 * 4. VISIBILIDAD Y LAYOUT
 * ------------------------------------------------------------------ */

function isVisible(n){
  if(n.kind !== "leaf") return true;
  return !!expanded[n.parent];
}

function updateVisibility(){
  NODES.forEach(function(n){ n.visible = isVisible(n); });
}

function layout(){
  var cursor = 0;
  var k2Seen = false;

  function place(n, depth){
    n.depth = depth;
    n.tx = COLX[depth];
    measure(n);
    var kids = childrenOf(n.id).filter(function(k){ return k.visible; });

    if(kids.length === 0){
      n.slot = cursor; cursor += 1;
    } else {
      for(var i=0;i<kids.length;i++){
        if(kids[i].id === "k2" && !k2Seen){ cursor += 1.1; k2Seen = true; }
        place(kids[i], depth + 1);
      }
      n.slot = (kids[0].slot + kids[kids.length-1].slot) / 2;
    }
  }

  place(byId.ce, 0);

  NODES.forEach(function(n){
    if(n.depth === undefined){
      n.txc = undefined; n.tyc = undefined;
      n.cx = undefined;  n.cy = undefined;
      return;
    }
    n.tx = COLX[n.depth];
    n.txc = n.tx + n.w/2;
    n.tyc = n.slot * ROW + 22;
  });
}

/* ------------------------------------------------------------------ *
 * 5. DIBUJO Y ANIMACION
 * ------------------------------------------------------------------ */

var running = false;

function draw(){
  NODES.forEach(function(n){
    if(!n.el) return;
    if(!n.visible){
      n.el.style.display = "none";
      if(n.pedge) n.pedge.style.display = "none";
      return;
    }
    if(n.el.style.display === "none"){
      n.el.style.display = "";
      n.el.style.opacity = "0";
      requestAnimationFrame(function(){ n.el.style.opacity = ""; });
    }
    if(!isFinite(n.cx) || !isFinite(n.cy)){ n.cx = n.txc; n.cy = n.tyc; }
    n.el.setAttribute("transform","translate(" + n.cx.toFixed(1) + "," + n.cy.toFixed(1) + ")");

    if(n.pedge){
      var p = byId[n.parent];
      if(p && p.visible){
        n.pedge.style.display = "";
        var x1 = p.cx + p.w/2, y1 = p.cy;
        var x2 = n.cx - n.w/2,  y2 = n.cy;
        var mx = (x1 + x2) / 2;
        n.pedge.setAttribute("d","M" + x1.toFixed(1) + "," + y1.toFixed(1) +
          " C" + mx.toFixed(1) + "," + y1.toFixed(1) + " " +
          mx.toFixed(1) + "," + y2.toFixed(1) + " " +
          x2.toFixed(1) + "," + y2.toFixed(1));
      }
    }
  });

  CROSS.forEach(function(e){
    var a = byId[e.from], b = byId[e.to];
    if(!a.visible || !b.visible){ e.el.style.display = "none"; e.tx.style.display = "none"; return; }
    e.el.style.display = "";

    var x1, x2;
    if(b.cx >= a.cx){ x1 = a.cx + a.w/2; x2 = b.cx - b.w/2; }
    else            { x1 = a.cx - a.w/2; x2 = b.cx + b.w/2; }
    var y1 = a.cy, y2 = b.cy;
    var dir = x2 >= x1 ? 1 : -1;
    var off = Math.max(46, Math.abs(x2 - x1) * 0.42);
    var c1x = x1 + off * dir, c2x = x2 - off * dir;

    e.el.setAttribute("d","M" + x1.toFixed(1) + "," + y1.toFixed(1) +
      " C" + c1x.toFixed(1) + "," + y1.toFixed(1) + " " +
      c2x.toFixed(1) + "," + y2.toFixed(1) + " " +
      x2.toFixed(1) + "," + y2.toFixed(1));

    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    e.tx.setAttribute("x", mx.toFixed(1));
    e.tx.setAttribute("y", (my - 7).toFixed(1));
    e.tx.style.display = (e.showLabel ? "" : "none");
  });
}

function step(){
  var moving = false;
  NODES.forEach(function(n){
    if(!n.visible) return;
    if(!isFinite(n.cx) || !isFinite(n.cy)){ n.cx = n.txc; n.cy = n.tyc; }
    var dx = n.txc - n.cx, dy = n.tyc - n.cy;
    if(Math.abs(dx) > 0.35 || Math.abs(dy) > 0.35){
      n.cx += dx * 0.24;
      n.cy += dy * 0.24;
      moving = true;
    } else {
      n.cx = n.txc;
      n.cy = n.tyc;
    }
  });
  draw();
  if(moving){ requestAnimationFrame(step); }
  else { running = false; }
}

function startTween(){
  if(running) return;
  running = true;
  requestAnimationFrame(step);
}

/* ------------------------------------------------------------------ *
 * 6. VISTA (zoom / pan / fit)
 * ------------------------------------------------------------------ */

function applyView(){
  vp.setAttribute("transform","translate(" + view.x.toFixed(2) + "," + view.y.toFixed(2) + ") scale(" + view.k.toFixed(4) + ")");
}

function fit(){
  var rect = stage.getBoundingClientRect();
  var availW = Math.max(240, rect.width - 70);
  var availH = Math.max(180, rect.height - 80);

  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  NODES.forEach(function(n){
    if(!n.visible) return;
    minX = Math.min(minX, n.tx);
    maxX = Math.max(maxX, n.tx + n.w);
    minY = Math.min(minY, n.slot * ROW);
    maxY = Math.max(maxY, n.slot * ROW + 44);
  });
  if(!isFinite(minX)) return;

  var w = maxX - minX, h = maxY - minY;
  var k = Math.min(availW / w, availH / h, 1.15);
  k = Math.max(k, 0.42);
  view.k = k;

  var visW = rect.width - (panelOpen ? 382 : 0);
  view.x = (visW - w * k) / 2 - minX * k;
  view.y = (rect.height - h * k) / 2 - minY * k;
  applyView();
}

function recenter(){
  var rect = stage.getBoundingClientRect();
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  NODES.forEach(function(n){
    if(!n.visible) return;
    minX = Math.min(minX, n.tx);
    maxX = Math.max(maxX, n.tx + n.w);
    minY = Math.min(minY, n.slot * ROW);
    maxY = Math.max(maxY, n.slot * ROW + 44);
  });
  if(!isFinite(minX)) return;

  var w = maxX - minX, h = maxY - minY;
  var visW = rect.width - (panelOpen ? 382 : 0);
  view.x = (visW - w * view.k) / 2 - minX * view.k;
  view.y = (rect.height - h * view.k) / 2 - minY * view.k;
  applyView();
}

/* ------------------------------------------------------------------ *
 * 7. INTERACCION
 * ------------------------------------------------------------------ */

function setExpanded(next, keepView){
  expanded = next;
  updateVisibility();
  layout();
  startTween();
  if(!keepView) setTimeout(fit, 30);
  if(selected && !byId[selected].visible){
    var p = byId[byId[selected].parent];
    while(p && !p.visible) p = byId[p.parent];
    if(p) select(p.id); else closePanel();
  }
}

function onNodeClick(id){
  var n = byId[id];
  if(n.kind === "dim"){
    if(expanded[id]) delete expanded[id];
    else expanded[id] = true;
    setExpanded(expanded, false);
  }
  select(id);
}

function select(id){
  var wasOpen = panelOpen;
  selected = id;
  NODES.forEach(function(n){
    if(n.el) n.el.classList.toggle("selected", n.id === id);
  });
  renderPanel(byId[id]);
  openPanel();
  highlight(id);
  if(id === "ce") fit();
  else if(!wasOpen) focusNode(id);
}

function highlight(id){
  if(id === "ce"){ clearHighlight(); return; }
  var keep = {};
  keep[id] = true;

  /* ancestros y descendientes directos */
  var p = byId[id].parent;
  while(p){ keep[p] = true; p = byId[p].parent; }
  childrenOf(id).forEach(function(c){ if(c.visible) keep[c.id] = true; });

  /* vecinos por aristas cruzadas */
  CROSS.forEach(function(e){
    if(e.from === id && byId[e.to].visible) keep[e.to] = true;
    if(e.to === id && byId[e.from].visible) keep[e.from] = true;
  });

  NODES.forEach(function(n){
    if(!n.el || !n.visible) return;
    n.el.classList.toggle("faded", !keep[n.id]);
  });

  NODES.forEach(function(n){
    if(!n.pedge) return;
    var on = keep[n.id] && keep[n.parent];
    n.pedge.classList.toggle("faded", !on);
  });

  CROSS.forEach(function(e){
    var on = (e.from === id || e.to === id);
    e.el.classList.toggle("faded", !on);
    e.showLabel = on;
  });
  draw();
}

function clearHighlight(){
  NODES.forEach(function(n){
    if(n.el) n.el.classList.remove("faded");
    if(n.pedge) n.pedge.classList.remove("faded");
  });
  CROSS.forEach(function(e){
    e.el.classList.remove("faded");
    e.showLabel = false;
  });
  draw();
}

/* ------------------------------------------------------------------ *
 * 8. PANEL
 * ------------------------------------------------------------------ */

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function pathOf(n){
  var parts = [];
  var cur = n;
  while(cur){ parts.unshift(cur); cur = cur.parent ? byId[cur.parent] : null; }
  return parts;
}

function kindLabel(n){
  if(n.kind === "root")   return "raiz del grafo";
  if(n.kind === "domain") return "dominio";
  if(n.kind === "dim")    return "dimension";
  return n.cat === "doc" ? "documento" : "unidad de conocimiento";
}

function renderPanel(n){
  if(!n) return;
  var kids = childrenOf(n.id);
  var rels = CROSS.filter(function(e){ return e.from === n.id || e.to === n.id; });

  var html = "";
  html += '<div class="p-top">';
  html +=   '<div><span class="p-code">' + esc(n.code) + '</span>';
  html +=   '<div class="p-kind">' + esc(kindLabel(n)) + '</div></div>';
  html +=   '<button class="p-close" id="pClose" title="Cerrar">&times;</button>';
  html += '</div>';

  html += '<h2 class="p-title">' + esc(n.label) + '</h2>';

  var crumb = pathOf(n).map(function(x){
    return x.id === n.id ? "<b>" + esc(x.label) + "</b>" : esc(x.label);
  }).join(" &rsaquo; ");
  html += '<div class="p-crumb">' + crumb + '</div>';

  html += '<p class="p-desc">' + esc(n.desc || "") + '</p>';

  if(n.meta){
    html += '<div class="p-sec">Metadatos de ejemplo</div>';
    html += '<div class="p-meta">' + esc(n.meta) + '</div>';
  }

  if(kids.length){
    html += '<div class="p-sec">Contiene (' + kids.length + ')</div><div class="chips">';
    kids.forEach(function(k){
      html += '<button class="chip" data-go="' + k.id + '"><span class="sw" style="background:' +
              colorOf(k) + '"></span>' + esc(k.label) + '</button>';
    });
    html += '</div>';
  }

  if(rels.length){
    html += '<div class="p-sec">Relacionado (' + rels.length + ')</div><div class="chips">';
    rels.forEach(function(e){
      var other = e.from === n.id ? e.to : e.from;
      var o = byId[other];
      var arrow = e.from === n.id ? "&rarr;" : "&larr;";
      html += '<button class="chip" data-go="' + o.id + '" title="' + esc(e.rel) + '">' +
              arrow + " " + esc(e.rel) + " &middot; " + esc(o.label) + '</button>';
    });
    html += '</div>';
  }

  if(n.kind === "dim"){
    html += '<div class="p-sec">Estado</div>';
    html += '<div class="p-meta">' + (expanded[n.id] ? "desplegada" : "contraida") +
            "  -  clic en el nodo para " + (expanded[n.id] ? "contraer" : "desplegar") + '</div>';
  }

  html += '<div class="p-note">Las aristas se generan desde la tabla <b>edges</b> ' +
          '(origen, relacion, destino). El mapa es una proyeccion de solo lectura: ' +
          'la fuente de verdad es el JSON/SQLite del proyecto.</div>';

  panelIn.innerHTML = html;

  var close = document.getElementById("pClose");
  if(close) close.addEventListener("click", closePanel);

  panelIn.querySelectorAll("[data-go]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-go");
      var target = byId[id];
      if(target.kind === "leaf" && !expanded[target.parent]){
        expanded[target.parent] = true;
        setExpanded(expanded, true);
      }
      select(id);
      focusNode(id);
    });
  });
}

function focusNode(id){
  var n = byId[id];
  if(!n || !n.visible) return;
  var rect = stage.getBoundingClientRect();
  var insetR = panelOpen ? 382 : 0;
  view.x = (rect.width - insetR) / 2 - n.cx * view.k;
  view.y = rect.height / 2 - n.cy * view.k;
  applyView();
}

function openPanel(){
  if(panelOpen) return;
  panelOpen = true;
  panel.classList.add("open");
}

function closePanel(){
  if(!panelOpen) return;
  panelOpen = false;
  panel.classList.remove("open");
  selected = null;
  NODES.forEach(function(n){ if(n.el) n.el.classList.remove("selected"); });
  clearHighlight();
  recenter();
}

/* ------------------------------------------------------------------ *
 * 9. BUSQUEDA
 * ------------------------------------------------------------------ */

var q = document.getElementById("q");

function normalize(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function runSearch(){
  var term = normalize(q.value.trim());
  matched = {};
  if(!term){
    NODES.forEach(function(n){ if(n.el) n.el.classList.remove("match","faded"); });
    return;
  }

  NODES.forEach(function(n){
    var hay = normalize(n.label + " " + n.code + " " + (n.desc || ""));
    if(hay.indexOf(term) !== -1){
      matched[n.id] = true;
      if(n.kind === "leaf" && !expanded[n.parent]){
        expanded[n.parent] = true;
        setExpanded(expanded, true);
      }
    }
  });

  var any = Object.keys(matched).length > 0;
  NODES.forEach(function(n){
    if(!n.el || !n.visible) return;
    n.el.classList.toggle("match", !!matched[n.id]);
    n.el.classList.toggle("faded", any && !matched[n.id]);
  });
}

q.addEventListener("input", runSearch);
q.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    var first = NODES.filter(function(n){ return matched[n.id]; })[0];
    if(first){ select(first.id); focusNode(first.id); }
  }
  if(e.key === "Escape"){ q.value = ""; runSearch(); q.blur(); }
});

document.addEventListener("keydown", function(e){
  if(e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if(e.key === "Escape"){ closePanel(); }
});

/* ------------------------------------------------------------------ *
 * 10. ZOOM / PAN
 * ------------------------------------------------------------------ */

stage.addEventListener("wheel", function(e){
  e.preventDefault();
  var r = stage.getBoundingClientRect();
  var mx = e.clientX - r.left, my = e.clientY - r.top;
  var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  var k2 = Math.min(3.2, Math.max(0.12, view.k * factor));
  view.x = mx - (mx - view.x) * (k2 / view.k);
  view.y = my - (my - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}, {passive:false});

var drag = null, moved = false;

stage.addEventListener("pointerdown", function(e){
  if(e.target.closest(".node")) return;
  drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
  moved = false;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("grabbing");
});

stage.addEventListener("pointermove", function(e){
  if(!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  view.x = drag.vx + dx;
  view.y = drag.vy + dy;
  applyView();
});

stage.addEventListener("pointerup", function(e){
  if(drag && !moved) closePanel();
  drag = null;
  stage.classList.remove("grabbing");
});

stage.addEventListener("pointercancel", function(){ drag = null; stage.classList.remove("grabbing"); });

/* ------------------------------------------------------------------ *
 * 11. BOTONES
 * ------------------------------------------------------------------ */

document.getElementById("expand").addEventListener("click", function(){
  var all = {};
  NODES.forEach(function(n){ if(n.kind === "dim") all[n.id] = true; });
  setExpanded(all);
  setTimeout(fit, 60);
});

document.getElementById("collapse").addEventListener("click", function(){
  setExpanded({});
  setTimeout(fit, 60);
});

document.getElementById("center").addEventListener("click", fit);

document.getElementById("json").addEventListener("click", function(){
  var nodes = NODES.map(function(n){
    return {id:n.id, codigo:n.code, tipo:n.kind, padre:n.parent, etiqueta:n.label};
  });
  var edges = [];
  NODES.forEach(function(n){
    if(n.parent) edges.push({origen:n.parent, relacion:"contiene", destino:n.id, tipo:"dura"});
  });
  CROSS.forEach(function(e){
    edges.push({origen:e.from, relacion:e.rel, destino:e.to, tipo:e.soft ? "blanda" : "dura"});
  });
  var data = {version:"1.0", fecha:"2026-11-11", dominio:"CodeExplain", nodes:nodes, edges:edges};
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mapa_conocimiento_codeexplain.json";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
});

/* ------------------------------------------------------------------ *
 * 12. ARRANQUE
 * ------------------------------------------------------------------ */

build();
updateVisibility();
layout();
NODES.forEach(function(n){ n.cx = n.txc; n.cy = n.tyc; });
draw();
select("ce");
fit();

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(fit, 150);
});

})();
</script>
</body>
</html>
